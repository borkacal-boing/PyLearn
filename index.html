function chipHtml(){const s=PY.state;return s==="ready"?`<span class="chip ready" id="pychip">Python připraven</span>`:s==="error"?`<span class="chip" id="pychip">Python se nenačetl</span>`:`<span class="chip" id="pychip"><span class="spin"></span> Načítám Python</span>`}
PY.listeners.push(()=>{const c=$("#pychip");if(c)c.outerHTML=chipHtml()});
const solvedL=l=>l.tasks.filter(t=>S.solved[t.id]).length;
const tasksC=c=>c.lessons.reduce((a,l)=>a+l.tasks.length,0);
const solvedC=c=>c.lessons.reduce((a,l)=>a+solvedL(l),0);
function nextUnsolved(){return ALL.find(x=>!S.solved[x.t.id])}
function lessonById(n){return LES.find(x=>x.l.n===n)}

function render(){
  if(view.name==="home")renderHome();
  else if(view.name==="chapter")renderChapter();
  else if(view.name==="lesson")renderLesson();
  else if(view.name==="task")renderTask();
}

function renderHome(){
  const done=Object.keys(S.solved).filter(k=>byId[k]).length,tot=ALL.length;
  const nx=nextUnsolved();
  let h=`<div class="top"><h1>Python krok za krokem</h1>${chipHtml()}</div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Tvůj postup</b><span class="muted">${done} / ${tot} úloh</span></div>
  <div class="bar"><i style="width:${tot?done/tot*100:0}%"></i></div>
  ${nx?`<div class="small muted" style="margin-top:10px">Lekce ${nx.l.n}: ${esc(nx.l.title)}</div><div class="row" style="margin-top:6px"><button class="btn" id="cont">${done?"Pokračovat":"Začít"}: ${esc(nx.t.title)}</button></div>`:`<p>Všechno hotovo. Klobouk dolů!</p>`}
  </div>
  <p class="muted small" style="margin:4px 2px 10px">${DATA.length} kapitol · ${LES.length} lekcí · ${ALL.length} úloh</p>`;
  DATA.forEach((c,ci)=>{
    const s=solvedC(c),n=tasksC(c);
    const ls=c.lessons[0].n,le=c.lessons[c.lessons.length-1].n;
    h+=`<div class="card chap" data-ci="${ci}"><div class="n">${ci+1}</div><div class="t"><b>${esc(c.title)}</b><small>${ls===le?`lekce ${ls}`:`lekce ${ls}–${le}`} · ${s} / ${n} úloh</small><div class="bar" style="margin-top:6px"><i style="width:${s/n*100}%"></i></div></div><span class="muted">›</span></div>`;
  });
  h+=`<p class="muted small">Postup se ukládá v tomhle prohlížeči. Kód běží přímo v telefonu, nikam se neodesílá.</p>`;
  app.innerHTML=h;
  app.querySelectorAll(".chap").forEach(el=>el.onclick=()=>go({name:"chapter",ci:+el.dataset.ci}));
  const b=$("#cont");if(b)b.onclick=()=>{if(nx.ti===0&&!(S.seen||{})[nx.l.n])go({name:"lesson",n:nx.l.n});else go({name:"task",id:nx.t.id})};
}

function renderChapter(){
  const c=DATA[view.ci];
  let h=`<div class="top"><button class="iconbtn" id="back">‹ Zpět</button><h1>${view.ci+1}. ${esc(c.title)}</h1></div>`;
  c.lessons.forEach(l=>{
    const s=solvedL(l),n=l.tasks.length;
    h+=`<div class="card chap" data-n="${l.n}"><div class="n" style="${s===n?"background:var(--ok);color:#fff":""}">${s===n?"✓":l.n}</div><div class="t"><b>${esc(l.title)}</b><small>Lekce ${l.n} · ${s} / ${n} úloh</small></div><span class="muted">›</span></div>`;
  });
  app.innerHTML=h;
  $("#back").onclick=()=>go({name:"home"});
  app.querySelectorAll(".chap").forEach(el=>el.onclick=()=>go({name:"lesson",n:+el.dataset.n}));
}

function renderLesson(){
  const L=lessonById(view.n),l=L.l;
  S.seen=S.seen||{};S.seen[l.n]=1;save();
  const nx=l.tasks.find(t=>!S.solved[t.id]);
  const prevL=LES[LES.indexOf(L)-1],nextL=LES[LES.indexOf(L)+1];
  let h=`<div class="top"><button class="iconbtn" id="back">‹ ${esc(DATA[L.ci].title)}</button></div>
  <div class="muted small">Lekce ${l.n} z ${LES.length}</div>
  <h2 style="margin:2px 0 10px;font-size:22px">${esc(l.title)}</h2>
  <div class="card md">${md(l.theory)}</div>
  <div class="label">Úlohy k lekci</div><div class="card" style="padding:0">`;
  l.tasks.forEach((t,ti)=>{
    h+=`<div class="task" data-id="${t.id}"><span class="chk ${S.solved[t.id]?"done":""}">${S.solved[t.id]?"✓":""}</span><span class="tt">${ti+1}. ${esc(t.title)}</span>${dots(t.lvl)}</div>`;
  });
  h+=`</div><div class="row"><button class="btn" id="start">${nx?(solvedL(l)?"Pokračovat v úlohách":"Začít úlohy"):"Projít úlohy znovu"}</button></div>
  <div class="row" style="justify-content:space-between;margin-top:18px">
    ${prevL?`<button class="iconbtn" id="prevL">‹ Lekce ${prevL.l.n}</button>`:"<span></span>"}
    ${nextL?`<button class="iconbtn" id="nextL">Lekce ${nextL.l.n} ›</button>`:""}
  </div>`;
  app.innerHTML=h;
  $("#back").onclick=()=>go({name:"chapter",ci:L.ci});
  $("#start").onclick=()=>go({name:"task",id:(nx||l.tasks[0]).id});
  app.querySelectorAll(".task").forEach(el=>el.onclick=()=>go({name:"task",id:el.dataset.id}));
  if(prevL)$("#prevL").onclick=()=>go({name:"lesson",n:prevL.l.n});
  if(nextL)$("#nextL").onclick=()=>go({name:"lesson",n:nextL.l.n});
}

/* ---------- task view ---------- */
function renderTask(){
  const x=byId[view.id],t=x.t,l=x.l;
  S.last=t.id;save();
  const idx=ALL.indexOf(x),prev=ALL[idx-1],next=ALL[idx+1];
  const first=t.tests[0];
  let example="";
  if(first.append){
    example=`<div class="label">Testy funkci zavolají takto</div>`+t.tests.map(ts=>`<pre class="code">${hl(ts.append)}\n<span class="co"># očekávaný výstup:</span>\n${esc(ts.expected)}</pre>`).join("");
  }else if(first.stdin!==""){
    example=`<div class="label">Příklad</div><div class="row small" style="align-items:flex-start;gap:10px"><div style="flex:1;min-width:120px"><div class="muted">Vstup</div><pre class="code">${esc(first.stdin)}</pre></div><div style="flex:1;min-width:120px"><div class="muted">Výstup</div><pre class="code">${esc(first.expected)||"<span class='muted'>(nic)</span>"}</pre></div></div>`;
  }else{
    example=`<div class="label">Očekávaný výstup</div><pre class="code">${esc(first.expected)}</pre>`;
  }
  const code=S.code[t.id]!=null?S.code[t.id]:t.starter;
  const keys=["⇥",":","(",")","\"","'","=","[","]","{","}","+","-","*","/","%","<",">",",",".","#","_","!","f\"","print()","input()","int()","range()","for","if","while","def","return"];
  app.innerHTML=`
  <div class="top"><button class="iconbtn" id="back">‹ Lekce ${l.n}</button><div style="flex:1"></div>${chipHtml()}</div>
  <div class="row" style="justify-content:space-between;margin-bottom:4px"><span class="muted small">Úloha ${x.ti+1} / ${l.tasks.length} · ${dots(t.lvl)} ${LVL[t.lvl]}</span>${S.solved[t.id]?`<span class="chip ready">✓ vyřešeno</span>`:""}</div>
  <h2 style="margin:2px 0 8px;font-size:21px">${esc(t.title)}</h2>
  <div class="md">${md(t.text)}</div>
  ${example}
  <div class="label">Tvůj kód</div>
  <div class="editor"><div class="gutter" id="gut">1</div><textarea class="code" id="ed" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" wrap="off"></textarea></div>
  <div class="keys" id="keys">${keys.map(k=>`<button class="${k.length>2?"w":""}" data-k="${esc(k)}">${esc(k)}</button>`).join("")}</div>
  ${!first.append?`<details id="stdinbox" ${first.stdin!==""?"open":""} style="margin-top:8px"><summary>Vstup pro tlačítko Spustit (každý řádek = jeden input())</summary><textarea class="stdin" id="stdin" autocapitalize="off" autocorrect="off" spellcheck="false">${esc(first.stdin)}</textarea></details>`:""}
  <div class="sticky"><div class="row"><button class="btn sec" id="run">▶ Spustit</button><button class="btn" id="check">✓ Zkontrolovat</button><div style="flex:1"></div><button class="iconbtn" id="reset" title="Vrátit původní kód">↺</button></div></div>
  <div id="result"></div>
  <div class="row" style="margin-top:6px">
    ${t.hint?`<button class="btn sec" id="hintb">💡 Nápověda</button>`:""}
    <button class="btn sec" id="solb">Řešení</button>
    <button class="btn sec" id="lesb">📖 Teorie</button>
  </div>
  <div id="hint"></div><div id="sol"></div>
  <div class="row" style="justify-content:space-between;margin-top:18px">
    ${prev?`<button class="iconbtn" id="prev">‹ Předchozí</button>`:"<span></span>"}
    ${next?`<button class="iconbtn" id="next">Další ›</button>`:""}
  </div>`;
  const ed=$("#ed");ed.value=code;
  setupEditor(ed,t.id);
  $("#back").onclick=()=>go({name:"lesson",n:l.n});
  $("#lesb").onclick=()=>go({name:"lesson",n:l.n});
  if(prev)$("#prev").onclick=()=>go({name:"task",id:prev.t.id});
  if(next)$("#next").onclick=()=>go({name:"task",id:next.t.id});
  $("#reset").onclick=()=>{
    if($("#reset").dataset.c){ed.value=t.starter;S.code[t.id]=t.starter;save();ed.dispatchEvent(new Event("input"));$("#reset").textContent="↺";delete $("#reset").dataset.c}
    else{$("#reset").textContent="Opravdu vymazat?";$("#reset").dataset.c=1;setTimeout(()=>{const r=$("#reset");if(r){r.textContent="↺";delete r.dataset.c}},3000)}
  };
  if(t.hint)$("#hintb").onclick=()=>{$("#hint").innerHTML=`<div class="card md" style="margin-top:8px">💡 ${md(t.hint)}</div>`};
  $("#solb").onclick=()=>{
    const b=$("#solb");
    if(!b.dataset.c){b.textContent="Opravdu? Zkus nejdřív nápovědu";b.dataset.c=1;return}
    $("#sol").innerHTML=`<div class="card" style="margin-top:8px"><div class="label" style="margin-top:0">Vzorové řešení</div><pre class="code">${hl(t.sol)}</pre><p class="muted small">Zkus ho přepsat sám a pochopit každý řádek. Úloha se počítá, až projde tvůj kód.</p></div>`;
    b.textContent="Řešení";
  };
  $("#run").onclick=()=>doRun(t,ed.value);
  $("#check").onclick=()=>doCheck(t,ed.value,next);
}

function setupEditor(ed,id){
  const gut=$("#gut");
  const fit=()=>{
    const n=ed.value.split("\n").length;
    gut.textContent=Array.from({length:n},(_,i)=>i+1).join("\n");
    ed.style.height="auto";ed.style.height=Math.max(154,ed.scrollHeight)+"px";
  };
  const fixQuotes=()=>{
    const v=ed.value;
    if(/[“”„‘’‚]/.test(v)){
      const p=ed.selectionStart;
      ed.value=v.replace(/[“”„]/g,'"').replace(/[‘’‚]/g,"'");
      ed.selectionStart=ed.selectionEnd=p;
    }
  };
  ed.addEventListener("input",()=>{fixQuotes();fit();S.code[id]=ed.value;save()});
  fit();
  const ins=(txt,back=0)=>{
    ed.focus();
    let ok=false;try{ok=document.execCommand("insertText",false,txt)}catch(e){}
    if(!ok){ed.setRangeText(txt,ed.selectionStart,ed.selectionEnd,"end");ed.dispatchEvent(new Event("input"))}
    if(back){ed.selectionStart=ed.selectionEnd=ed.selectionStart-back}
  };
  ed.addEventListener("keydown",e=>{
    if(e.key==="Tab"){e.preventDefault();ins("    ")}
    else if(e.key==="Enter"&&!e.isComposing){
      const v=ed.value,p=ed.selectionStart;
      const ls=v.lastIndexOf("\n",p-1)+1;const line=v.slice(ls,p);
      let ind=(line.match(/^ */)||[""])[0];
      if(/:\s*$/.test(line))ind+="    ";
      e.preventDefault();ins("\n"+ind);
    }else if(e.key==="Backspace"&&ed.selectionStart===ed.selectionEnd){
      const v=ed.value,p=ed.selectionStart;const ls=v.lastIndexOf("\n",p-1)+1;const before=v.slice(ls,p);
      if(before.length>=4&&/^ +$/.test(before)){
        e.preventDefault();const s=p-((before.length%4)||4);
        ed.setRangeText("",s,p,"end");ed.selectionStart=ed.selectionEnd=s;ed.dispatchEvent(new Event("input"));
      }
    }
  });
  $("#keys").querySelectorAll("button").forEach(b=>{
    b.addEventListener("pointerdown",e=>e.preventDefault());
    b.addEventListener("mousedown",e=>e.preventDefault());
    b.addEventListener("click",e=>{
      e.preventDefault();const k=b.dataset.k;
      if(k==="⇥")ins("    ");
      else if(k.endsWith("()"))ins(k,1);
      else if(k==='f"')ins('f""',1);
      else if(["for","if","while","def","return"].includes(k))ins(k+" ");
      else ins(k);
    });
  });
}

function busy(on){["run","check"].forEach(i=>{const b=$("#"+i);if(b)b.disabled=on});}
function loadingNote(){return PY.state==="ready"?"":`<div class="card small"><span class="spin"></span> Python se načítá (poprvé to může trvat i půl minuty)…</div>`}

async function doRun(t,code){
  const box=$("#result");busy(true);
  box.innerHTML=loadingNote()||`<div class="card small"><span class="spin"></span> Běží…</div>`;
  const st=$("#stdin");
  let full=code,stdin=st?st.value:"";
  if(t.tests[0].append){full=code+"\n"+t.tests[0].append;stdin=""}
  const r=await runPy(full,stdin.replace(/\r/g,"").replace(/\n+$/,""));
  if(!$("#result"))return;
  busy(false);
  const ul=code.split("\n").length;
  $("#result").innerHTML=`<div class="label">Výstup${t.tests[0].append?" (s voláním z prvního testu)":""}</div><div class="out">${esc(r.out)||"<span class='muted'>(program nic nevypsal)</span>"}</div>${r.err?errHtml(r.err,ul):""}`;
}

async function doCheck(t,code,next){
  const box=$("#result");busy(true);
  box.innerHTML=loadingNote()||`<div class="card small"><span class="spin"></span> Kontroluji…</div>`;
  const ul=code.split("\n").length;
  const results=[];
  for(const ts of t.tests){
    const r=await runPy(ts.append?code+"\n"+ts.append:code,ts.stdin);
    const got=norm(r.out);
    results.push({ts,r,got,ok:!r.err&&got===ts.expected});
    if(r.err&&r.err[0]==="Timeout")break;
  }
  if(!$("#result"))return;
  busy(false);
  const allOk=results.length===t.tests.length&&results.every(x=>x.ok);
  let h="";
  if(allOk){
    S.solved[t.id]=true;save();
    h+=`<div class="res ok"><b>Výborně! Všechny testy prošly (${results.length}/${results.length}).</b></div>`;
    if(next){const nl=next.l.n!==byId[t.id].l.n;h+=`<div class="row"><button class="btn ok" id="gonext">${nl?`Další lekce: ${esc(next.l.title)} ›`:"Další úloha ›"}</button></div>`;}
  }else{
    const n=results.filter(x=>x.ok).length;
    h+=`<div class="res bad"><b>Prošlo ${n} z ${t.tests.length} testů.</b></div>`;
    results.forEach((x,i)=>{
      const desc=x.ts.append?`<div class="muted small">Volání:</div><pre class="code">${hl(x.ts.append)}</pre>`:(x.ts.stdin!==""?`<div class="muted small">Vstup:</div><div class="out">${esc(x.ts.stdin)}</div>`:"");
      if(x.ok){h+=`<div class="testbox ok"><h4>✓ Test ${i+1}</h4></div>`;return}
      h+=`<div class="testbox bad"><h4>✗ Test ${i+1}</h4>${desc}
        <div class="muted small" style="margin-top:6px">Očekávaný výstup:</div><div class="out">${esc(x.ts.expected)||"<span class='muted'>(nic)</span>"}</div>
        <div class="muted small" style="margin-top:6px">Tvůj výstup:</div><div class="out">${esc(x.got)||"<span class='muted'>(nic)</span>"}</div>
        ${x.r.err?errHtml(x.r.err,ul):diffNote(x.got,x.ts.expected)}</div>`;
    });
  }
  box.innerHTML=h;
  const g=$("#gonext");if(g)g.onclick=()=>{if(next.l.n!==byId[t.id].l.n)go({name:"lesson",n:next.l.n});else go({name:"task",id:next.t.id})};
  box.scrollIntoView({behavior:"smooth",block:"start"});
  if(view.name==="task"&&allOk){const chip=document.querySelector("h2");}
}
function diffNote(got,exp){
  if(/(^|\n)None$/.test(got)&&!/(^|\n)None$/.test(exp))return `<p class="small">Na konci se vypsalo <code>None</code>. Funkce nejspíš výsledek vypisuje pomocí <code>print</code>, místo aby ho vracela pomocí <code>return</code>.</p>`;
  if(got.toLowerCase()===exp.toLowerCase())return `<p class="small">Liší se jen velká a malá písmena.</p>`;
  if(got.replace(/\s+/g,"")===exp.replace(/\s+/g,""))return `<p class="small">Liší se jen mezery nebo řádkování.</p>`;
  const gl=got.split("\n"),el=exp.split("\n");
  for(let i=0;i<Math.max(gl.length,el.length);i++){
    if(gl[i]!==el[i])return `<p class="small">První rozdíl je na ${i+1}. řádku výstupu.</p>`;
  }
  return "";
}

render();
startWorker();

if("serviceWorker" in navigator&&location.protocol==="https:"){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
}
